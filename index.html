<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buildbound Obby</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="obby.css" />
  </head>
  <body>
    <main class="obby-app">
      <header class="obby-topbar">
        <div class="obby-brand"><span class="brand-square"></span><span>BUILDBOUND</span></div>
        <div class="course-status">
          <span id="checkpointLabel">CHECKPOINT 1</span>
          <span class="status-dot"></span>
          <strong id="timerLabel">00:00</strong>
        </div>
        <button id="resetButton" class="top-button" type="button">RESET</button>
      </header>

      <section class="obby-layout">
        <div class="game-column">
          <div class="stage-toolbar">
            <div>
              <span class="toolbar-label">COURSE</span>
              <strong>THE SKYLINE</strong>
            </div>
            <div id="modeLabel" class="mode-label">PLAY MODE</div>
          </div>
          <div class="canvas-frame">
            <canvas id="gameCanvas" width="960" height="600" aria-label="Buildbound Obby game"></canvas>
            <div id="toast" class="toast" aria-live="polite"></div>
          </div>

          <div class="touch-controls" aria-label="Touch controls">
            <div class="move-pad">
              <button type="button" data-key="a" aria-label="Move left">←</button>
              <button type="button" data-key="d" aria-label="Move right">→</button>
            </div>
            <button class="jump-button" type="button" data-key="jump">JUMP</button>
          </div>
        </div>

        <aside class="build-panel">
          <div class="panel-heading">
            <span>BUILD TOOL</span>
            <button id="buildModeButton" class="mode-button" type="button">BUILD: OFF</button>
          </div>
          <div class="block-grid" aria-label="Block palette">
            <button class="block-choice selected" type="button" data-color="#ef5b4e" data-name="Red"><span class="block-swatch red"></span><small>RED</small></button>
            <button class="block-choice" type="button" data-color="#f6c945" data-name="Yellow"><span class="block-swatch yellow"></span><small>YELLOW</small></button>
            <button class="block-choice" type="button" data-color="#5bbd8b" data-name="Green"><span class="block-swatch green"></span><small>GREEN</small></button>
            <button class="block-choice" type="button" data-color="#5b9bd5" data-name="Blue"><span class="block-swatch blue"></span><small>BLUE</small></button>
          </div>
          <div class="tool-actions">
            <button id="deleteModeButton" type="button">DELETE</button>
            <button id="clearBlocksButton" type="button">CLEAR BUILDS</button>
          </div>
          <div class="control-guide">
            <div><kbd>WASD</kbd><span>Move</span></div>
            <div><kbd>SPACE</kbd><span>Jump</span></div>
            <div><kbd>B</kbd><span>Build mode</span></div>
            <div><kbd>X</kbd><span>Delete block</span></div>
          </div>
        </aside>
      </section>
    </main>

    <div id="overlay" class="obby-overlay visible">
      <div class="start-card">
        <span class="card-kicker">WORLD 01</span>
        <h1>THE SKYLINE</h1>
        <p>Reach the finish flag. Build blocks to cross tricky gaps, activate checkpoints, and race your best time.</p>
        <button id="startButton" class="start-button" type="button">PLAY COURSE <span>→</span></button>
      </div>
    </div>

    <script src="obby.js?v=1"></script>
  </body>
</html>
