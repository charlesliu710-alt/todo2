<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo2 - 2D Sword Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hud">
      <div class="topbar">
        <div class="health-wrap">
          <div class="label">HP</div>
          <div class="health-bar">
            <div id="healthFill" class="health-fill"></div>
          </div>
        </div>
        <div class="combo-display" id="comboDisplay"></div>
        <div id="score" class="score">Kills: 0</div>
      </div>
    </div>

    <aside class="settings-panel">
      <h2>Settings</h2>
      <div class="wave-display" id="waveDisplay">Wave: 1</div>
      <label class="toggle-row">
        <span>Invincible</span>
        <input id="invincibleToggle" type="checkbox" />
      </label>
      <label class="slider-row">
        <span>Dmg: <span id="damageLabel">1.0x</span></span>
        <input id="damageSlider" type="range" min="0.5" max="3" step="0.1" value="1" />
      </label>
      <label class="slider-row">
        <span>Speed: <span id="speedLabel">1.0x</span></span>
        <input id="speedSlider" type="range" min="0.5" max="2" step="0.1" value="1" />
      </label>
      <label class="slider-row">
        <span>Enemies: <span id="enemySpeedLabel">1.0x</span></span>
        <input id="enemySpeedSlider" type="range" min="0.3" max="2" step="0.1" value="1" />
      </label>
    </aside>

    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div id="overlay" class="overlay visible">
      <div class="panel">
        <h1>2D Sword Arena</h1>
        <p>Move with WASD</p>
        <p>Attack with mouse click or Space</p>
        <p>Survive as long as you can</p>
        <button id="startButton">Start Game</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
